[build]
  command = "pnpm --filter @fdl/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# The web app calls /api/*; in dev Vite proxies it, here Netlify does. Same-origin for the browser, so no CORS.
[[redirects]]
  from = "/api/*"
  to = "https://fdlapi-production.up.railway.app/:splat"
  status = 200
  force = true

# Single-page app: every other path serves the shell so /leads/:id etc. survive a refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
